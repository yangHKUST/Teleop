# Canonical bimanual controller configuration, shared by both the bringup
# launch (openarm.bimanual.launch.py) and the MoveIt demo (demo.launch.py).
#
# A single combined `both_arms_joint_trajectory_controller` drives all 14 arm
# joints. This matches what MoveIt's moveit_controllers.yaml maps to, so the
# controller topology is identical whether you start bringup or the MoveIt demo.
#
# update_rate is 100 Hz for both paths. The previous 750 Hz bringup setting
# (`interpolation_method: none`) and the separate left/right JTCs were removed:
# a joint trajectory controller interpolating at 100 Hz is the correct fit for
# this non-realtime SocketCAN polling stack, and 750 Hz offered no benefit while
# making the two launch paths behave differently.

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    both_arms_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

both_arms_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

    interpolation_method: "splines"
    interpolate_from_desired_state: false

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      openarm_left_joint1: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint2: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint3: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint4: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint5: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint6: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint7: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint1: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint2: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint3: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint4: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint5: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint6: { trajectory: 0.0, goal: 0.0 }
      openarm_right_joint7: { trajectory: 0.0, goal: 0.0 }

left_gripper_controller:
  ros__parameters:
    joints:
      - openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position

    interpolation_method: "splines"
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

right_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

right_gripper_controller:
  ros__parameters:
    joints:
      - openarm_right_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position

    interpolation_method: "splines"
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
