%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

Camera.type: "KannalaBrandt8"

# Left Camera calibration and distortion parameters (OpenCV)
Camera.fx: 447.453836385634986
Camera.fy: 447.187983077160879
Camera.cx: 668.034762384103146
Camera.cy: 486.042153255789003

# Kannala-Brandt distortion parameters
Camera.k1: 0.22759168811027
Camera.k2: 0.001953410618605
Camera.k3: -0.041267294817544
Camera.k4: 0.013845973576408

# Right Camera calibration and distortion parameters (OpenCV)
Camera2.fx: 445.882722165967948
Camera2.fy: 445.706720326432219
Camera2.cx: 613.156495529447284
Camera2.cy: 503.383556887113002

# Kannala-Brandt distortion parameters
Camera2.k1: 0.24412017362966
Camera2.k2: -0.050366833768087
Camera2.k3: 0.016388039478275
Camera2.k4: -0.007076302379888

# Transformation matrix from right camera to left camera
Tlr: !!opencv-matrix
  rows: 3
  cols: 4
  dt: f
  data: [ 0.99998113, 0.00215006, -0.00575454, 0.059772599482593,
          -0.00214281, 0.9999969, 0.00126663, 0.000217072800526,
          0.00575725, -0.00125428, 0.99998264, 0.000101340890155]

# Lapping area between images  HAN
Camera.lappingBegin: 0
Camera.lappingEnd: 1279

Camera2.lappingBegin: 0
Camera2.lappingEnd: 1279

# Camera resolution
Camera.width: 1280
Camera.height: 1024

# Camera frames per second
Camera.fps: 30.0

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 0

# Close/Far threshold. Baseline times.   HAN
ThDepth: 60.0
Camera.bf: 26.745478949228392

# Transformation from body-frame (imu) to left camera
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.99999102, 0.00276856, -0.00320955, -0.01559447,
           0.00285415, -0.99963204, 0.02697463, 0.01203081,
           -0.00313369, -0.02698355, -0.99963097, -0.03259404,
           0, 0, 0, 1]

# IMU noise (Allan variance measured for BMI088)
IMU.NoiseGyro: 0.00021243046780248539  # rad/s^0.5
IMU.NoiseAcc: 0.0015177735193787072    # m/s^1.5
IMU.GyroWalk: 3.1742020064828066e-06   # rad/s^1.5
IMU.AccWalk: 5.800367172683552e-05     # m/s^2.5
IMU.Frequency: 200
#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image   HAN
ORBextractor.nFeatures: 800 # Tested with 1250

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 6

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast	  HAN
ORBextractor.iniThFAST: 15 # 20
ORBextractor.minThFAST: 7 # 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500
